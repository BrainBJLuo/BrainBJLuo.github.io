<script>
/* Native, offline AODE lab. Scores propose; OLS refits decide (AODE, Algorithms 1–2).
   The schematic uses the exact observation order in Figure 1. The separate case
   uses reconstructed data: all fits, losses and exchanges are computed here. */
(() => {
'use strict';
const q=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>[...r.querySelectorAll(s)];
const all=Array.from({length:15},(_,i)=>i+1);
const S=[2,3,9,13,14], N=all.filter(i=>!S.includes(i));
const sortedS=[9,14,2,3,13], sortedN=[8,11,6,1,4,12,7,5,10,15];
const colors=['#339f8d','#59c475','#35ac8c','#329d8c','#3c8998','#42b68e','#3b8f99','#bbdc4b','#e8e82b','#3c8198','#7acf67','#329c8d','#31a28e','#d3e43b','#583674'];
const score=[.51,.7,.55,.5,.31,.6,.34,.87,.99,.25,.78,.48,.53,.94,.08];
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const mix=(a,b,t)=>a+(b-a)*t;
const same=(a,b)=>a.length===b.length&&[...a].sort((x,y)=>x-y).every((v,i)=>v===[...b].sort((x,y)=>x-y)[i]);

function fit(points,retained){
 const keep=new Set(retained), data=points.filter(p=>keep.has(p.id));
 const mx=data.reduce((v,p)=>v+p.x,0)/data.length,my=data.reduce((v,p)=>v+p.y,0)/data.length;
 const xx=data.reduce((v,p)=>v+(p.x-mx)**2,0);
 if(!data.length||xx<1e-12)throw new Error('The retained design must have full rank.');
 const slope=data.reduce((v,p)=>v+(p.x-mx)*(p.y-my),0)/xx,intercept=my-slope*mx;
 const loss=data.reduce((v,p)=>v+(p.y-intercept-slope*p.x)**2,0)/(2*points.length);
 return{intercept,slope,loss};
}
function candidates(points,retained,kmax=4){
 const base=fit(points,retained),keep=new Set(retained);
 const residual=p=>(p.y-base.intercept-base.slope*p.x)**2;
 const inside=points.filter(p=>keep.has(p.id)).sort((a,b)=>residual(b)-residual(a)||a.id-b.id);
 const outside=points.filter(p=>!keep.has(p.id)).sort((a,b)=>residual(a)-residual(b)||a.id-b.id);
 return Array.from({length:Math.min(kmax,inside.length,outside.length)},(_,j)=>{
  const k=j+1,remove=inside.slice(0,k).map(p=>p.id),add=outside.slice(0,k).map(p=>p.id);
  const next=retained.filter(id=>!remove.includes(id)).concat(add);
  return{k,remove,add,retained:next,fit:fit(points,next)};
 });
}
function makeTrace(data){
 let retained=[...data.initial],current=fit(data.points,retained);const rounds=[];
 const count=ids=>data.points.filter(p=>p.outlier&&ids.includes(p.id)).length;
 for(let i=0;i<data.points.length;i++){
  const proposals=candidates(data.points,retained,data.kmax);let best=null;
  for(const c of proposals)if(c.fit.loss<(best?best.fit.loss:current.loss)-1e-12)best=c;
  if(!best)break;
  rounds.push({retained:[...retained],fit:current,outliers:count(retained),candidates:proposals,best});
  retained=[...best.retained];current=best.fit;
 }
 return{rounds,terminal:candidates(data.points,retained,data.kmax),initial:{retained:[...data.initial],fit:fit(data.points,data.initial),outliers:count(data.initial)},final:{retained,fit:current,outliers:count(retained)},count};
}

</div><span class="aode-control-note">Follow the illuminated step.</span></div><p class="aode-footnote">This is one fixed-budget splicing step. Full AODE repeats these updates and uses SIC to choose the outlier budget.</p>`;
  lab.insertBefore(q('.aode-controls',lab),q('.aode-view',lab));

function caseStudy(){

 displayed losses and updates are computed from this dataset. This fixed-budget example illustrates Algorithms 1–2 with a zero stopping threshold (numerical tolerance 10⁻¹²), without the outer SIC search.</p>`;

 function draw(time){
  const seg=segments.find(s=>time<s.end)||segments.at(-1),u=Math.max(0,Math.min(1,(time-seg.start)/seg.duration)),r=trace.rounds[seg.round],key=seg.kind+':'+seg.round+':'+seg.index;

<script>
/* GSFM / GFSM: a computed, self-contained K=2 teaching example.
 * Four analytic trajectories share X'' + omega X' = f(X,t).
 * The observed response is X plus deterministic measurement noise: f is UNKNOWN.
 * Fits use all 68 smoothed state-time nodes and the unweighted symmetrized 3NN
 * Laplacian. No known driving values or true coefficients enter the estimator.
 * This small example fixes K and the two smoothing parameters, rather than
 * reproducing the paper's outer cross-validation or PM2.5 application.
 */
(function (root) {
  'use strict';

  const TIMES = Array.from({length:17}, (_,j) => 6*j/16);
  const INITIALS = [[-1.35,.1],[.6,1.25],[1.3,-.8],[-.4,-1.5]];
  const dot = (a,b) => a.reduce((s,v,i) => s+v*b[i],0);
  const zeros = (rows,cols) => Array.from({length:rows}, () => Array(cols).fill(0));
  const multiply = (matrix,vector) => matrix.map(row => dot(row,vector));

  /* Diagonal scaling plus Cholesky solves the original positive-definite system.
   * There is no hidden ridge, clipping or nonnegativity constraint on omega/f. */
  function solveSPD(matrix,rhs) {
    const n=rhs.length, scale=matrix.map((row,i) => Math.sqrt(row[i]));
    if(scale.some(v => !Number.isFinite(v)||v<=0))throw new Error('Invalid GSFM normal matrix.');
    const C=zeros(n,n),b=rhs.map((v,i) => v/scale[i]);
    for(let i=0;i<n;i++) {
      for(let j=0;j<=i;j++) {
        let value=matrix[i][j]/(scale[i]*scale[j]);
        for(let k=0;k<j;k++)value-=C[i][k]*C[j][k];
        if(i===j) {
          if(value<=1e-13)throw new Error('GSFM normal matrix is numerically singular.');
          C[i][j]=Math.sqrt(value);
        }else C[i][j]=value/C[j][j];
      }
    }
    const y=Array(n).fill(0),z=Array(n).fill(0);
    for(let i=0;i<n;i++) {
      let value=b[i];
      for(let j=0;j<i;j++)value-=C[i][j]*y[j];
      y[i]=value/C[i][i];
    }
    for(let i=n-1;i>=0;i--) {
      let value=y[i];
      for(let j=i+1;j<n;j++)value-=C[j][i]*z[j];
      z[i]=value/C[i][i];
    }
    return z.map((v,i) => v/scale[i]);
  }

  /* Actual discrete roughness-penalized smoothing: min_z ||y-z||^2 +
   * lambda ||Delta^2 z||^2. This is explicitly a discrete approximation,
   * not a claim that a natural smoothing spline was fitted. */
  function smoothDiscrete(values,lambda) {
    const n=values.length,A=zeros(n,n);
    for(let i=0;i<n;i++)A[i][i]=1;
    const difference=[1,-2,1];
    for(let r=0;r<n-2;r++)for(let a=0;a<3;a++)for(let b=0;b<3;b++)
      A[r+a][r+b]+=lambda*difference[a]*difference[b];
    return solveSPD(A,values);
  }

  /* Natural cubic interpolation is for drawing the fitted state samples only.
   * Interpolated display samples do not create additional graph/fit nodes. */
  function splineEvaluator(points,key) {
    const n=points.length,x=points.map(p=>p.t),y=points.map(p=>p[key]);
    if(n<2)throw new Error('At least two interpolation points are required.');
    const second=Array(n).fill(0),u=Array(n).fill(0);
    for(let i=1;i<n-1;i++) {
      const sig=(x[i]-x[i-1])/(x[i+1]-x[i-1]),p=sig*second[i-1]+2;
      second[i]=(sig-1)/p;
      const slopeChange=(y[i+1]-y[i])/(x[i+1]-x[i])-(y[i]-y[i-1])/(x[i]-x[i-1]);
      u[i]=(6*slopeChange/(x[i+1]-x[i-1])-sig*u[i-1])/p;
    }
    for(let i=n-2;i>=0;i--)second[i]=second[i]*second[i+1]+u[i];
    return function(value) {
      const t=Math.max(x[0],Math.min(x[n-1],value));
      let lo=0,hi=n-1;
      while(hi-lo>1){const mid=(lo+hi)>>1;if(x[mid]>t)hi=mid;else lo=mid;}
      const h=x[hi]-x[lo],a=(x[hi]-t)/h,b=(t-x[lo])/h;
      return a*y[lo]+b*y[hi]+((a*a*a-a)*second[lo]+(b*b*b-b)*second[hi])*h*h/6;
    };
  }
  function interpolateNatural(points,t,key='x') {return splineEvaluator(points,key)(t);}
  function sampleSmooth(curve,count=129) {
    const evaluate=splineEvaluator(curve.smooth,'x'),a=curve.smooth[0].t,b=curve.smooth.at(-1).t;
    return Array.from({length:count},(_,i)=>{const t=a+(b-a)*i/(count-1);return{t,x:evaluate(t)};});
  }

  function truthAt(curve,t) {
    const [a,b]=INITIALS[curve],g=.16,frequency=1.2,omega=2*g,kappa=frequency*frequency+g*g;
    const homogeneous=Math.exp(-g*t)*(a*Math.cos(frequency*t)+b*Math.sin(frequency*t));
    const x=4+homogeneous+.35*Math.sin(.65*t);
    const forcing=.35*((kappa-.65*.65)*Math.sin(.65*t)+omega*.65*Math.cos(.65*t));
    return {x,f:-kappa*(x-4)+forcing};
  }

  function graph(nodes,k) {
    const N=nodes.length,W=zeros(N,N),neighbors=[];
    const distanceSquared=(i,j)=>(nodes[i].x-nodes[j].x)**2+(nodes[i].t-nodes[j].t)**2;
    for(let i=0;i<N;i++) {
      const ranked=Array.from({length:N},(_,j)=>j).filter(j=>j!==i)
        .sort((a,b)=>distanceSquared(i,a)-distanceSquared(i,b)||a-b);
      neighbors.push(ranked.slice(0,k));
      for(const j of neighbors[i])W[i][j]=W[j][i]=1;
    }
    const degree=W.map(row=>row.reduce((s,v)=>s+v,0));
    const L=W.map((row,i)=>row.map((v,j)=>i===j?degree[i]:-v)),edges=[];
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)if(W[i][j])edges.push({a:i,b:j,distance:Math.sqrt(distanceSquared(i,j))});
    return{neighbors,W,degree,L,edges};
  }

  function affineProjection(values,times,weights) {
    const s0=weights.reduce((s,w)=>s+w,0),s1=dot(weights,times),s2=dot(weights,times.map(t=>t*t));
    const v0=dot(weights,values),v1=dot(weights,values.map((v,j)=>v*times[j])),det=s0*s2-s1*s1;
    const intercept=(s2*v0-s1*v1)/det,slope=(s0*v1-s1*v0)/det;
    return{intercept,slope,values:times.map(t=>intercept+slope*t)};
  }

  function build(options={}) {
    const smoothingLambda=options.smoothingLambda??.7,nu=options.nu??.01,k=options.k??3;
    if(!(smoothingLambda>=0&&nu>0&&Number.isInteger(k)&&k>0&&k<68))throw new Error('Invalid GSFM teaching-example parameters.');
    const n=4,m=17,N=n*m,dt=TIMES[1]-TIMES[0],weights=TIMES.map((t,j)=>j===0||j===m-1?dt/2:dt);
    const curves=INITIALS.map((initial,i)=>{
      const observations=TIMES.map((t,j)=>{
        const noise=.11*(Math.sin((i+1)*11.3+(j+1)*7.9)+.45*Math.cos((i+2)*5.1+(j+1)*3.7));
        return{t,y:truthAt(i,t).x+noise};
      });
      const fitted=smoothDiscrete(observations.map(p=>p.y),smoothingLambda);
      return{id:i,label:`Trajectory ${i+1}`,observations,smooth:TIMES.map((t,j)=>({t,x:fitted[j]}))};
    });
    const nodes=curves.flatMap((curve,i)=>curve.smooth.map((p,j)=>({index:i*m+j,curve:i,sample:j,t:p.t,x:p.x,f:null})));
    const {neighbors,W,degree,L,edges}=graph(nodes,k);
    const x=nodes.map(p=>p.x),quadWeights=nodes.map(p=>weights[p.sample]);
    const H=zeros(N,2*n),M=Array(N).fill(0),G=zeros(N,N);
    for(let i=0;i<n;i++) {
      for(let a=0;a<m;a++) {
        const row=i*m+a;H[row][2*i]=1;H[row][2*i+1]=TIMES[a];
        // Prefix trapezoidal integration of -X: correct half weight at each cutoff.
        if(a>0)M[row]=M[row-1]-.5*dt*(x[row-1]+x[row]);
        // Green kernel G_2(t,s)=(t-s)_+; its diagonal and upper triangle are zero.
        for(let b=0;b<a;b++)G[row][i*m+b]=(TIMES[a]-TIMES[b])*weights[b];
      }
    }
    const fOffset=2*n+1,P=fOffset+N,B=H.map((row,i)=>row.concat(M[i],G[i]));
    const normal=zeros(P,P),rhs=Array(P).fill(0);
    for(let i=0;i<N;i++)for(let a=0;a<P;a++) {
      const weighted=quadWeights[i]*B[i][a];
      rhs[a]+=weighted*x[i];
      for(let b=0;b<=a;b++)normal[a][b]+=weighted*B[i][b];
    }
    for(let a=0;a<P;a++)for(let b=0;b<a;b++)normal[b][a]=normal[a][b];
    for(let i=0;i<N;i++)for(let j=0;j<N;j++)normal[fOffset+i][fOffset+j]+=nu*L[i][j];
    const solution=solveSPD(normal,rhs),alpha=solution.slice(0,2*n),omega=solution[2*n],f=solution.slice(fOffset);
    nodes.forEach((node,i)=>node.f=f[i]);
    const rawNull=multiply(H,alpha),rawLocal=M.map(v=>v*omega),rawCurrent=multiply(G,f);
    const rawReconstructed=rawNull.map((v,i)=>v+rawLocal[i]+rawCurrent[i]);
    let maxIdentityError=0,maxWeightedOrthogonality=0;
    const decomposition=curves.map((curve,i)=>{
      const begin=i*m,end=begin+m,local0=rawLocal.slice(begin,end),current0=rawCurrent.slice(begin,end);
      const localProjection=affineProjection(local0,TIMES,weights),currentProjection=affineProjection(current0,TIMES,weights);
      const local=local0.map((v,j)=>v-localProjection.values[j]),current=current0.map((v,j)=>v-currentProjection.values[j]);
      const nullPart=rawNull.slice(begin,end).map((v,j)=>v+localProjection.values[j]+currentProjection.values[j]);
      const reconstructed=nullPart.map((v,j)=>v+local[j]+current[j]);
      const residual=reconstructed.map((v,j)=>curve.smooth[j].x-v);
      for(let j=0;j<m;j++)maxIdentityError=Math.max(maxIdentityError,Math.abs(reconstructed[j]-rawReconstructed[begin+j]));
      for(const part of [local,current]) {
        maxWeightedOrthogonality=Math.max(maxWeightedOrthogonality,Math.abs(dot(weights,part)),Math.abs(dot(weights,part.map((v,j)=>v*TIMES[j]))));
      }
      const result={t:[...TIMES],null:nullPart,local,current,reconstructed,residual,
        raw:{null:rawNull.slice(begin,end),local:local0,current:current0},
        transferred:{local:localProjection.values,current:currentProjection.values}};
      curve.decomposition=result;
      return result;
    });
    const residual=x.map((v,i)=>v-rawReconstructed[i]);
    const weightedResidual=dot(quadWeights,residual.map(v=>v*v));
    const graphEnergy=edges.reduce((s,e)=>s+(f[e.a]-f[e.b])**2,0),penalty=nu*graphEnergy;
    const normalResidual=multiply(normal,solution).map((v,i)=>v-rhs[i]);
    const relativeNormalResidual=Math.max(...normalResidual.map(Math.abs))/Math.max(1,...rhs.map(Math.abs));
    const laplacianEnergy=dot(f,multiply(L,f));
    const projectionChecks={maxIdentityError,maxWeightedOrthogonality,relativeNormalResidual,
      graphEnergyError:Math.abs(laplacianEnergy-graphEnergy),maxLaplacianRowSum:Math.max(...L.map(row=>Math.abs(row.reduce((s,v)=>s+v,0))))};
    if(maxIdentityError>1e-9||maxWeightedOrthogonality>1e-8||relativeNormalResidual>1e-9)throw new Error('GSFM numerical validation failed.');
    const targetObjective=weightedResidual+penalty;
    const currentOnlyEnergy=dot(rawCurrent,rawCurrent),localOnlyEnergy=dot(rawLocal,rawLocal);
    return{
      meta:{method:'Green-Structured Functional Matching',shortName:'GSFM',K:2,n,m,N,k,
        domain:[0,6],smoothingLambda,smoothing:'discrete second-difference penalized least squares',
        fit:'joint unconstrained penalized least squares in alpha, omega and 68 driving values',
        distance:{name:'Euclidean distance on (X,t)',xScale:1,tScale:1,normalized:false},
        quadrature:'Trapezoidal time weights; prefix trapezoidal integration for M = -integral(X).',
        graph:'Unweighted OR-symmetrized directed k-nearest-neighbor graph',
        fixedTuning:true,crossValidation:false,interpolation:'Natural cubic interpolation for display only'},
      times:[...TIMES],weights,curves,nodes,neighbors,edges,L,W,degree,omega,nu,alpha,f,
      decomposition,operators:{H,M,G,quadratureWeights:quadWeights},
      objective:{weightedResidual,graphEnergy,penalty,total:targetObjective,
        rms:Math.sqrt(dot(residual,residual)/N),relativeNormalResidual},
      projectionChecks,
      truth:{omega:.32,kappa:1.4656,center:4,forcingAmplitude:.35,forcingFrequency:.65,
        equation:"X'' + 0.32 X' = -1.4656 (X-4) + 0.35 [1.0431 sin(0.65t) + 0.208 cos(0.65t)]",
        trajectories:INITIALS.map((initial,i)=>TIMES.map(t=>({t,...truthAt(i,t)})))},
      provenance:'Computed synthetic teaching example, not reported manuscript results. Four analytic damped trajectories share one state-time driving function. Only noisy trajectory values are observed. Discrete second-difference smoothing, a symmetrized kNN graph, a joint Green-matching solve, and weighted affine projection are actually computed. K=2, smoothing lambda and graph nu are fixed for this illustration; no cross-validation is claimed.'
    };
  }

  root.GFSM_MODEL={build,smoothDiscrete,interpolateNatural,sampleSmooth,truthAt};
})(typeof window==='undefined'?globalThis:window);

<script>
/* Four continuous scenes over one shared synthetic dataset. No external libraries. */
(() => {
'use strict';
const colors=['#dcba82','#7dc6b3','#afabe0','#dc9583'];
const clamp=x=>Math.max(0,Math.min(1,x));
const mix=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t);};
const phase=(u,a,b)=>ease((u-a)/(b-a));
const q=(s,r=document)=>r.querySelector(s);
const qa=(s,r=document)=>[...r.querySelectorAll(s)];
const steps=['Presmooth','kNN graph','Functional matching','Decompose'];
const durations=[4400,11200,10500,11500];
function panelHtml(){return `<div class="gfsm-panel" data-gfsm-panel><div class="gfsm-heading"><div><span>FIGURE 02 · SEMIPARAMETRIC DYNAMICS</span><h4>Green-structured<br>functional matching</h4><p class="gfsm-deck">Shared operator estimation from replicated trajectories.</p></div><div class="gfsm-count" aria-hidden="true" hidden>01 <small>/ 04</small></div></div><div class="gfsm-controls" role="group" aria-label="Sequential GFSM algorithm steps">${steps.map((name,i)=>`<button type="button" class="gfsm-step" data-gfsm-step="${i}" ${i?'disabled':''}><span aria-hidden="true">(${String.fromCharCode(97+i)})</span>${name}</button>`).join('')}</div><div class="gfsm-stage"><span class="gfsm-stage-label"></span><canvas class="gfsm-plot" role="img" aria-label="Four noisy trajectories, their smoothing, a state-time neighbor graph, the joint loss, and additive trajectory decompositions."></canvas></div><div class="gfsm-legend"></div><p class="gfsm-figure-caption"><b>Fig. 2.</b> Presmoothing (a), state–time neighborhoods (b), Green-function matching (c), and an additive dynamic decomposition (d).</p><div class="gfsm-loss"><div class="gfsm-loss-label">GREEN-STRUCTURED FUNCTIONAL MATCHING</div><div class="gfsm-objective"><small>minimize jointly over α, ω, f</small><span>‖D̄<sup>½</sup>(x − H̄α − Mω − G̃f)‖²</span><br><span class="loss-green">+ ν fᵀLf</span></div><div class="gfsm-loss-details"><span>L = D − W</span><span>fᵀLf = Σ<sub>{i,j}∈E</sub>(fᵢ − fⱼ)²</span></div></div><div class="gfsm-caption" role="status" aria-live="polite"><strong></strong><p></p></div><div class="gfsm-progress" aria-hidden="true"><span></span></div><p class="gfsm-source">Computed synthetic example · Four trajectories · 68 samples · K = 2.</p></div>`;}

let cachedModel=null;
const getModel=()=>cachedModel||(cachedModel=window.GFSM_MODEL.build());
function overview(){
 const m=getModel(),curves=m.curves,nodes=m.nodes;
 const values=curves.flatMap(c=>c.observations.map(p=>p.y)),lo=Math.min(...values)-.3,hi=Math.max(...values)+.3;
 const P=(t,x,left,top,width,height)=>[left+t/6*width,top+height-(x-lo)/(hi-lo)*height];
 const point=(p,r,c,a=1)=>`<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="${r}" fill="${c}" opacity="${a}"/>`;
 const path=(ps,col,w=1.4,dash='')=>`<path d="${ps.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
 const axes=(x,y,w,h)=>`<path d="M${x} ${y}V${y+h}H${x+w}" fill="none" stroke="#6d8b7b" stroke-width=".7"/>`;
 const plot=curves.map((c,k)=>c.observations.map(p=>point(P(p.t,p.y,34,48,225,70),1.5,colors[k],.5)).join('')+path(window.GFSM_MODEL.sampleSmooth(c,65).map(p=>P(p.t,p.x,34,48,225,70)),colors[k])).join('');

<script>
/* Fixed-budget coupled support search for the RCSS method illustration.
 * All displayed coefficients, scores and losses come from this small dataset.
 * Truth is used to generate and explain the example, never to choose updates.
 * The draft's ambiguous pseudocode is interpreted explicitly in assumptions.
 */
(() => {
  'use strict';

  const TOLERANCE = 1e-10;
  const indices = n => Array.from({length:n}, (_, i) => i);
  const ordered = values => [...values].sort((a, b) => a - b);
  const snapshot = state => ({A:[...state.A], S:[...state.S], fit:state.fit});

  function random(seed) {
    let a = seed >>> 0;
    return () => {
      a += 0x6D2B79F5;
      let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Partial-pivot Gaussian elimination. Only three active columns are fitted.
  function solve(matrix, rhs) {
    const size = rhs.length;
    const augmented = matrix.map((row, i) => [...row, rhs[i]]);
    for (let j = 0; j < size; j++) {
      let pivot = j;
      for (let i = j + 1; i < size; i++) {
        if (Math.abs(augmented[i][j]) > Math.abs(augmented[pivot][j])) pivot = i;
      }
      if (Math.abs(augmented[pivot][j]) < 1e-10) {
        throw new Error('RCSS requires a full-rank retained active design.');
      }
      [augmented[j], augmented[pivot]] = [augmented[pivot], augmented[j]];
      const divisor = augmented[j][j];
      for (let k = j; k <= size; k++) augmented[j][k] /= divisor;
      for (let i = 0; i < size; i++) {
        if (i === j) continue;
        const multiplier = augmented[i][j];
        for (let k = j; k <= size; k++) {
          augmented[i][k] -= multiplier * augmented[j][k];
        }
      }
    }
    return augmented.map(row => row[size]);
  }

  // A = selected columns; S = anomalous rows excluded from the OLS fit.
  // prediction = X beta; residuals = y - X beta, BEFORE mean-shift removal.
  function fit(X, y, A, S) {
    const n = y.length, p = X[0].length;
    const flagged = new Set(S), retained = indices(n).filter(i => !flagged.has(i));
    if (!A.length || retained.length < A.length) {
      throw new Error('RCSS needs active columns and enough retained observations.');
    }
    const gram = A.map(j => A.map(k =>
      retained.reduce((sum, i) => sum + X[i][j] * X[i][k], 0)));
    const rhs = A.map(j => retained.reduce((sum, i) => sum + X[i][j] * y[i], 0));

    A.forEach((j, k) => { beta[j] = activeBeta[k]; });

    const residuals = y.map((value, i) => value - prediction[i]);
    const gamma = residuals.map((value, i) => flagged.has(i) ? value : 0);
    const adjustedResiduals = residuals.map((value, i) => value - gamma[i]);
    const loss = adjustedResiduals.reduce((sum, value) => sum + value * value, 0) / (2 * n);
    return {beta, gamma, residuals, adjustedResiduals, prediction, loss};
  }

  function scoreRows(state) {
    const active = new Set(state.S);
    return state.fit.residuals.map((value, id) => ({
      id, score:value * value, active:active.has(id)
    }));
  }

  function scoreColumns(X, state) {
    const n = X.length, active = new Set(state.A), flagged = new Set(state.S);
    const retained = indices(n).filter(i => !flagged.has(i));
    return indices(X[0].length).map(id => {
      const norm = retained.reduce((sum, i) => sum + X[i][id] ** 2, 0);
      const correlation = retained.reduce((sum, i) =>
        sum + X[i][id] * state.fit.residuals[i], 0);
      const backward = norm * state.fit.beta[id] ** 2 / (2 * n);
      const forward = norm > 1e-12 ? correlation ** 2 / (2 * n * norm) : 0;
      return {id, active:active.has(id), backward, forward,
        score:active.has(id) ? backward : forward};
    });
  }

  function exchange(X, y, state, axis, kmax) {
    const scores = axis === 'row' ? scoreRows(state) : scoreColumns(X, state);
    // The least supported current members leave; the strongest outsiders enter.
    const removeOrder = scores.filter(item => item.active)
      .sort((a, b) => a.score - b.score || a.id - b.id).map(item => item.id);
    const addOrder = scores.filter(item => !item.active)
      .sort((a, b) => b.score - a.score || a.id - b.id).map(item => item.id);

    const candidates = [];

      const support = axis === 'row' ? state.S : state.A;

      }

  function search(X, y, initialA, initialS, kmax = 2) {

      if (!row.best && !column.best) {

      }

    });

    for (let j = 0; j < p; j++) {
      const mean = X.reduce((sum, row) => sum + row[j], 0) / n;
      const scale = Math.sqrt(X.reduce((sum, row) => sum + (row[j] - mean) ** 2, 0) / n);
      X.forEach(row => { row[j] = (row[j] - mean) / scale; });
    }

    const beta = Array(p).fill(0), gamma = Array(n).fill(0);
    features.forEach((id, i) => { beta[id] = [2.8, -2.1, 1.7][i]; });
    outliers.forEach((id, i) => { gamma[id] = [7.6, -8.3, 7.9, -7.4][i]; });
    const noise = indices(n).map(() => .12 * (2 * rng() - 1));
    const y = X.map((row, i) =>
      row.reduce((sum, value, j) => sum + value * beta[j], 0) + noise[i] + gamma[i]);
    const trace = search(X, y, [1, 2, 6], [0, 3, 8, 18], kmax);
    return {
      X, y, n, p, s1, s2, seed, kmax, tolerance:TOLERANCE,
      truth:{features, outliers, beta, gamma}, noise, ...trace,
      provenance:'Deterministic synthetic method illustration (seed 2), not manuscript experiment data. All scores, refits and losses are computed from these 24 observations.',
      assumptions:[
        'S denotes flagged outlier rows; N is its complement. A denotes selected features. All indices are zero-based.',
        'The fixed budgets are |A| = 3 and |S| = 4. The model has no intercept, matching the manuscript theoretical setup.',
        'Resolve inconsistent draft indices by removing the smallest residual scores from S and adding the largest from N; refit on the new N and current A.',
        'On retained rows, backward sacrifice is ||X_j||^2 beta_j^2/(2n); forward gain is (X_j^T residual)^2/(2n ||X_j||^2). Only their within-group rankings propose exchanges.',
        'Each k = 1,2 candidate comes from the same parent support. The least refitted loss is accepted only when it improves by more than 1e-10.',
        'The row phase precedes the feature phase; feature scores use the accepted row state. Both phases repeat until neither improves.',
        'This illustrates the unambiguous fixed-budget core. It does not implement the unfinished draft outer HSIC budget grid or assert its incomplete theoretical guarantees.'
      ]
    };
  }

  window.RCSS_MODEL = {build, fit, search};
})();

   q('strong',el).textContent=`L ${metric(f.totalPerimeter??f.perimeter)}`;
   q('small',el).textContent=`σ² ${variance(f.areaVariance??f.areaError)}${eligible?'':' ×'}`;
  });
  results.innerHTML=data.candidates.map((c,i)=>{
   const f=c.final,eligible=isEligible(c,tolerance);
   return `<li class="${i===best?'is-best ':''}${eligible?'':'is-ineligible'}"><div><b>${String(i+1).padStart(2,'0')}</b><span>${i===best?'SHORTEST':eligible?'AREA PASS':'AREA FAIL'}</span></div><strong>L ${metric(f.totalPerimeter??f.perimeter)}</strong><small>σ²(A) ${variance(f.areaVariance??f.areaError)}</small></li>`;

 }
 function isEligible(candidate,tolerance){
  const f=candidate.final,error=f.areaVariance??f.areaError;

 function finish(){
  phase='final';zoom=1;fraction=1;active=false;setPhase('final');progress.style.width='100%';
  if(best!==null){
   const f=data.candidates[best].final,count=data.candidates.filter(c=>isEligible(c,data.areaTolerance)).length;
   winnerLabel.hidden=false;winnerLabel.innerHTML=`<span>SHORTEST OF ${count} AREA-FEASIBLE CANDIDATES</span><strong>Candidate ${String(best+1).padStart(2,'0')} · L = ${metric(f.totalPerimeter??f.perimeter)}</strong>`;
   results.hidden=false;enableRotation(true);
   canvas.setAttribute('aria-label',`Candidate ${best+1}, the shortest of ${count} area-feasible candidates among nine starts. Total geodesic boundary length ${metric(f.totalPerimeter??f.perimeter)}. Drag to rotate, use arrow keys, or press Home to reset orientation.`);
   announce(`Candidate ${String(best+1).padStart(2,'0')} has the shortest comparable boundary.`,`Area variance ≤ ${data.areaTolerance.toExponential(0)}. This comparison covers these nine searches only. Drag the sphere or use the arrow keys.`);
  }else{
   // Keep all nine actual results visible when none is area-feasible.
   phase='compare';zoom=0;enableRotation(false);results.hidden=true;

  }

   phase='search';fraction=clamp((elapsed-a)/Math.max(1,durations.search));zoom=0;
   if(phaseKey!=='search'){
    labels.forEach(el=>{q('strong',el).textContent='Moving vertices';q('small',el).textContent='On the sphere';});
    announce('Nine searches, moving together.','Each sphere follows its own recorded vertex updates. The initial Voronoi cells evolve under the area constraint.');
   }
   setPhase('search');
  }else if(elapsed<c){
   phase='compare';fraction=1;zoom=0;
   if(phaseKey!=='compare'){
    presentFinalMetrics();
    announce(best===null?'Checking the area constraint.':'Compare the final geodesic lengths.',best===null?'No candidate is currently eligible for a perimeter comparison.':`Candidate ${String(best+1).padStart(2,'0')} has the smallest boundary length among the candidates that meet the area tolerance.`);
   }
   setPhase('compare');
  }else if(best===null){finish();return;}

  if(!document.hidden)raf=requestAnimationFrame(tick);
 }
 async function start(n){
  if(disposed)return;stopDrag();const token=++generation;controller?.abort();controller=new AbortController();cancelAnimationFrame(raf);
  active=false;lastTime=null;elapsed=0;data=null;best=null;fraction=0;zoom=0;phase='computing';phaseKey='';rotation=[...initialRotation];pointer=null;
  winnerLabel.hidden=true;results.hidden=true;enableRotation(false);progress.style.width='0%';
  q('.sphere-grid-labels',root).style.opacity='1';labels.forEach(el=>{el.classList.remove('is-best','is-ineligible');q('strong',el).textContent='Preparing';q('small',el).textContent='Random start';});
  qa('[data-sphere-n]',root).forEach(button=>button.setAttribute('aria-pressed',Number(button.dataset.sphereN)===n));

  try{
   if(!window.SPHERE_SEARCH?.build)throw new Error('The sphere-search model is not loaded.');
   const seed=(n*2654435761+(++run)*97409)>>>0;

    if(token!==generation)return;
    announce(`Computing candidate ${Math.min(update.total||9,(update.completed||0)+1)} of ${update.total||9}.`,'You can select a different N while the searches are being prepared.');
   }});

   data=result;

   eligible.sort((a,b)=>(a.candidate.final.totalPerimeter??a.candidate.final.perimeter)-(b.candidate.final.totalPerimeter??b.candidate.final.perimeter)||a.index-b.index);

   announce('Nine independent random starts.','The first configuration is a spherical Voronoi partition. Next, its boundary vertices move directly on the unit sphere.');
   canvas.setAttribute('aria-label',`Nine random spherical partitions with ${n} cells, arranged in a three by three grid. Boundary vertices follow the computed search trajectories.`);
   durations=reduced()?{initial:300,search:0,compare:1800,zoom:0}:{initial:850,search:7200,compare:1900,zoom:1500};
   phase='initial';fraction=0;active=true;lastTime=null;draw();if(!document.hidden)raf=requestAnimationFrame(tick);
  }catch(error){

   phase='error';active=false;announce('This search could not be completed.',`${error.message||'The geometry computation failed.'} Select an N to retry.`);root.dataset.phase='error';
  }
 }
 qa('[data-sphere-n]',root).forEach(button=>listen(button,'click',()=>start(Number(button.dataset.sphereN))));
 listen(canvas,'pointerdown',event=>{
  if(phase!=='final'||best===null||pointer!==null||event.isPrimary===false)return;
  pointer={id:event.pointerId,x:event.clientX,y:event.clientY};canvas.setPointerCapture(event.pointerId);canvas.style.cursor='grabbing';

 });

 });

<script>
/* Original method diagrams, not experimental plots or medical images.
 * Verified primary sources:
 * https://github.com/s20011208/Retinal-BLIP2-VQA/blob/main/docs/study.md
 * https://github.com/s20011208/Retinal-BLIP2-VQA/blob/main/src/retinal_blip2/models/blip2_adapter.py

 */
(() => {
  'use strict';
  const C = {ink:'#304b45', muted:'#63746a', faint:'#91a28f', line:'#b5c2b0',
    mint:'#477565', gold:'#897043', lavender:'#7c7190', blue:'#596f7b', bg:'#f0e7d2'};
  const FONT = '"Segoe UI", Arial, sans-serif';
  const MONO = 'Consolas, "Courier New", monospace';
  function label(c, text, x, y, size=11, color=C.ink, align='left', weight=400, width=Infinity, family=FONT) {
    c.save();
    c.font=`${weight} ${size}px ${family}`;
    while(c.measureText(text).width>width && size>8){size-=.25;c.font=`${weight} ${size}px ${family}`;}
    c.fillStyle=color;c.textAlign=align;c.textBaseline='alphabetic';c.fillText(text,x,y);c.restore();
  }
  function line(c,points,color=C.line,width=1,dash=[]) {
    c.save();c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));
    c.strokeStyle=color;c.lineWidth=width;c.setLineDash(dash);c.stroke();c.restore();
  }
  function arrow(c,x1,y1,x2,y2,color=C.faint,dash=[]) {

    const a=Math.atan2(y2-y1,x2-x1),s=3.7;
    line(c,[[x2-s*Math.cos(a-.55),y2-s*Math.sin(a-.55)],[x2,y2],
      [x2-s*Math.cos(a+.55),y2-s*Math.sin(a+.55)]],color,1.1);
  }
  function box(c,x,y,w,h,fill='#f8f4e9',stroke=C.line,r=8) {
    c.save();c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);

  }

  }
  function base(c,w,h) {

  function retina(c,w,h) {

    const side=iw*.25,mid=iw*.40,gap=iw*.05;
    const vx=m,bx=m+side+gap,lx=bx+mid+gap;
    const by=compact?102:113,bh=h<280?59:compact?65:73,inlet=by-12;
    label(c,'Retinal image',vx+side/2,inlet,small?9:10,C.muted,'center');
    label(c,'Question prompt',lx+side/2,inlet,small?9:10,C.muted,'center',400,side+8);
    arrow(c,vx+side/2,inlet+3,vx+side/2,by-2);
    arrow(c,lx+side/2,inlet+3,lx+side/2,by-2);
    box(c,vx,by,side,bh,'#f8f4e9','#c5c2ac');
    box(c,bx,by,mid,bh,'#eadebd','#b8a16f');
    box(c,lx,by,side,bh,'#f8f4e9','#c5c2ac');
    const center=by+bh*.54;
    label(c,'FROZEN',vx+side/2,by+14,8,C.blue,'center',600);
    label(c,'ViT',vx+side/2,center,small?19:22,C.ink,'center',600);
    label(c,'image encoder',vx+side/2,by+bh-10,small?9:10,C.muted,'center',400,side-8);
    label(c,'TRAINABLE',bx+mid/2,by+14,8,C.gold,'center',600);
    label(c,'Q-Former',bx+mid/2,center,small?16:19,'#685737','center',600);
    label(c,'query tokens + projection',bx+mid/2,by+bh-10,small?8.5:10,C.gold,'center',400,mid-12);
    label(c,'FROZEN',lx+side/2,by+14,8,C.blue,'center',600);
    label(c,'OPT',lx+side/2,center,small?19:22,C.ink,'center',600);
    label(c,'language model',lx+side/2,by+bh-10,small?9:10,C.muted,'center',400,side-8);
    arrow(c,vx+side+3,by+bh*.5,bx-3,by+bh*.5,C.mint);
    arrow(c,bx+mid+3,by+bh*.5,lx-3,by+bh*.5,C.gold);
    const gy=by+bh+11;
    line(c,[[lx+side/2,by+bh+2],[lx+side/2,gy],[bx+mid/2,gy]],C.gold,.9,[3,3]);
    arrow(c,bx+mid/2,gy,bx+mid/2,by+bh+2,C.gold);
    label(c,'Answer loss trains the bridge through frozen OPT',m+iw/2,gy+13,small?8:9,C.gold,'center',400,iw);
    const ey=h-83,ew=(iw-10)/2,eh=42;
    box(c,m,ey,ew,eh,'#f8f4e9','#c9c2ab',6);
    box(c,m+ew+10,ey,ew,eh,'#f8f4e9','#c9c2ab',6);
    label(c,'01  VQA answers',m+11,ey+17,small?10:12,C.ink,'left',600,ew-20);
    label(c,'Fixed candidate scoring',m+11,ey+32,small?8.5:10,C.muted,'left',400,ew-20);
    label(c,'02  Lesion evidence',m+ew+21,ey+17,small?10:12,C.ink,'left',600,ew-20);
    label(c,'4 reference-mask types',m+ew+21,ey+32,small?8.5:10,C.muted,'left',400,ew-20);

  // An exact damped-oscillator illustration, not an arbitrary decorative wave:
  // X'' + a X' = -X. Equal-state dots are solved from the two trajectories.
  function oscillator(t,a,x0,v0) {
    const omega=Math.sqrt(1-a*a/4);
    return Math.exp(-a*t/2)*(x0*Math.cos(omega*t)+(v0+a*x0/2)/omega*Math.sin(omega*t));
  }
  function crossing(a,x0,v0,state) {

    for(let i=0;i<45;i++){const mid=(lo+hi)/2;if(oscillator(mid,a,x0,v0)>state)lo=mid;else hi=mid;}
    return (lo+hi)/2;
  }
  function matchedStates(c,x,y,w,h) {
    const left=x+5,right=x+w-5,top=y+3,bottom=y+h-6;
    const px=t=>left+t/2.3*(right-left),py=v=>bottom-(v+.35)/1.45*(bottom-top);
    line(c,[[left,top],[left,bottom],[right,bottom]],'#a0b19d',.7);
    const specs=[[.55,1,0,C.mint],[.65,.8,.2,C.gold]],state=.4;
    line(c,[[left,py(state)],[right,py(state)]],'#9cab98',.7,[2,3]);
    specs.forEach(([a,x0,v0,color])=>{
      const path=Array.from({length:60},(_,i)=>{const t=i*2.3/59;return[px(t),py(oscillator(t,a,x0,v0))];});
      line(c,path,color,1.5);dot(c,px(crossing(a,x0,v0,state)),py(state),2.7,color,C.bg);
    });
    label(c,'x*',left+2,py(state)-4,8,C.muted);
    label(c,'t',right,bottom+9,8,C.muted,'right');
  }
  function density(c,x,y,w,h) {
    const left=x+3,right=x+w-3,bottom=y+h-4,top=y+3;
    const px=z=>left+(z+1.5)/3*(right-left);
    const f=z=>.15+.85*Math.exp(-.5*((z-.15)/.29)**2);
    const py=d=>bottom-d*(bottom-top);
    c.fillStyle='#7c9d8022';c.fillRect(px(-.3),top,px(.6)-px(-.3),bottom-top);
    line(c,[[left,bottom],[right,bottom]],'#a0b19d',.7);
    line(c,[[left,py(.15)],[right,py(.15)]],C.faint,.7,[2,3]);
    line(c,Array.from({length:80},(_,i)=>{const z=-1.5+3*i/79;return[px(z),py(f(z))];}),C.mint,1.7);
  }
  function sourceGraph(c,x,y,w,h) {
    const cx=x+w*.39,cy=y+h*.46,rx=w*.25,ry=h*.34;
    const pts=Array.from({length:6},(_,i)=>[cx+rx*Math.cos(i*Math.PI/3),cy+ry*Math.sin(i*Math.PI/3)]);

    c.save();base(c,w,h);

  window.PROJECT_RESEARCH_ART = {

        artBottom:'VQA ANSWERS + LESION EVIDENCE',artKind:'METHOD DIAGRAM',
        alt:'Method schematic, not experimental results: retinal images enter a frozen ViT; a trainable Q-Former, query tokens and projection connect to frozen OPT, which also receives the question prompt. Answer-loss gradients train only this visual bridge. Separate studies evaluate fixed-candidate VQA answers and four reference-mask lesion types.'},
      dynamics:{artTop:'D-SIDE / SELECTIVE DYNAMICS INTEGRATION',
        artBottom:'POOL RELATED SOURCES · KEEP DISTINCT FITS',artKind:'METHOD DIAGRAM',
        alt:'D-SIDE method schematic, not experimental results: match trajectories at equal positions, model the distribution of labeled dynamical contrasts, and select related sources. Selected sources share one nonlinear function while retaining separate damping coefficients; other sources keep independent fits. The small trajectories are illustrative exact damped-oscillator solutions.'}
    }

(function(root){
'use strict';
const C={ink:'#304b45',muted:'#63746a',faint:'#91a28f',line:'#b5c2b0',gold:'#897043',mint:'#477565',lilac:'#7c7190',amber:'#a46b54'};
const SANS='Arial, Helvetica, sans-serif';
const MONO='Consolas, "Courier New", monospace';
function txt(ctx,str,x,y,size=13,color=C.ink,align='left',weight=400,family=SANS){ctx.font=`${weight} ${size}px ${family}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(str,x,y);ctx.textAlign='left';}
function path(ctx,points,color=C.line,width=1,dash=[]){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);}
function disc(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();}
function rr(ctx,x,y,w,h,r=7){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function background(ctx,w,h){const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#f5efde');g.addColorStop(1,'#eadfc5');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
function arrow(ctx,x1,y1,x2,y2,color=C.faint,width=1.4){path(ctx,[[x1,y1],[x2,y2]],color,width);const a=Math.atan2(y2-y1,x2-x1),s=4.5;path(ctx,[[x2-s*Math.cos(a-.55),y2-s*Math.sin(a-.55)],[x2,y2],[x2-s*Math.cos(a+.55),y2-s*Math.sin(a+.55)]],color,width);}

function dialysis(ctx,w,h){
 ctx.save();background(ctx,w,h);
 const small=w<400,pad=small?22:28,Y=v=>40+(v-40)*(h-80)/220;

 const plotTop=Y(109),plotBottom=Y(184),axisY=Y(197);
 ctx.fillStyle='rgba(164,107,84,.06)';ctx.fillRect(X(1.25),plotTop,right-X(1.25),plotBottom-plotTop);
 path(ctx,[[X(1),plotTop],[X(1),plotBottom]],'#8a9e8b77',1);
 path(ctx,[[X(1.25),plotTop-5],[X(1.25),axisY]],C.gold,1.2,[4,4]);
 const rows=[{label:'Intention to treat',hr:.76,lo:.47,hi:1.24,ly:99,cy:120,col:C.mint},{label:'Per protocol',hr:.83,lo:.48,hi:1.41,ly:154,cy:175,col:C.amber}];
 for(const row of rows){
  txt(ctx,row.label,pad,Y(row.ly),small?12.5:14,C.ink,'left',500);
  txt(ctx,`${row.hr.toFixed(2)}  [${row.lo.toFixed(2)}, ${row.hi.toFixed(2)}]`,w-pad,Y(row.ly),small?12:13,row.col,'right',500,MONO);
  const cy=Y(row.cy);path(ctx,[[X(row.lo),cy],[X(row.hi),cy]],row.col,2.8);
  for(const v of[row.lo,row.hi])path(ctx,[[X(v),cy-5],[X(v),cy+5]],row.col,1.6);
  const px=X(row.hr),r=5.3;ctx.beginPath();ctx.moveTo(px,cy-r);ctx.lineTo(px+r,cy);ctx.lineTo(px,cy+r);ctx.lineTo(px-r,cy);ctx.closePath();ctx.fillStyle=row.col;ctx.fill();ctx.strokeStyle='#f8f4e9';ctx.lineWidth=1.2;ctx.stroke();
 }
 path(ctx,[[left,axisY],[right,axisY]],C.line,1);
 for(const value of[.5,1,1.25,1.6]){const x=X(value),color=value===1.25?C.gold:C.muted;path(ctx,[[x,axisY],[x,axisY+4]],color,1);txt(ctx,String(value),x,axisY+16,11.5,color,'center',400,MONO);}
 txt(ctx,'Upper 95% CI must be ≤ 1.25',w/2,Y(235),small?12:13,C.gold,'center');
 txt(ctx,'ITT met the margin; PP did not.',w/2,Y(255),small?13.2:15,C.ink,'center',600);
 ctx.restore();
}

function documentIcon(ctx,x,y,col){
 rr(ctx,x-10,y-13,20,26,3);ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
 path(ctx,[[x-5,y-6],[x+5,y-6]],col,1.3);path(ctx,[[x-5,y-1],[x+2,y-1]],col,1.3);
 path(ctx,[[x-5,y+6],[x-1,y+9],[x+7,y+2]],col,1.8);
}
function financingIcon(ctx,x,y,col){
 ctx.beginPath();ctx.ellipse(x,y-5,12,4,0,0,2*Math.PI);ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
 for(const dy of[0,5]){ctx.beginPath();ctx.ellipse(x,y+dy,12,4,0,0,Math.PI);ctx.stroke();}
 path(ctx,[[x-12,y-5],[x-12,y+5]],col,1.5);path(ctx,[[x+12,y-5],[x+12,y+5]],col,1.5);
 arrow(ctx,x+18,y-10,x+18,y+8,col,1.6);
}
function digitalIcon(ctx,x,y,col){
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
  const px=x+a*8,py=y+b*8;ctx.fillStyle=(a===0||b===0)?col:'#a0b39a';ctx.fillRect(px-2,py-2,4,4);
 }
 rr(ctx,x-15,y-15,30,30,5);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.stroke();
}
function fintech(ctx,w,h){
 ctx.save();background(ctx,w,h);
 const small=w<400,pad=small?20:27,cx=w/2,iconY=115+(h-275)*.35,resultTop=h-96;
 txt(ctx,'China A-share panel  /  2009–2020',pad,51,small?12:13,C.muted);
 const sourceWidth=small?184:202;
 rr(ctx,cx-sourceWidth/2,61,sourceWidth,31,15);ctx.fillStyle='#eadebd';ctx.fill();ctx.strokeStyle='#b8a16f';ctx.lineWidth=1;ctx.stroke();
 txt(ctx,'Regional FinTech',cx,82,small?17:18,C.gold,'center',500);
 const xs=[w*.18,w*.50,w*.82],cols=[C.mint,C.gold,C.lilac];
 path(ctx,[[cx,92],[cx,99],[xs[0],99],[xs[0],iconY-19]],C.faint,1.1);
 path(ctx,[[cx,99],[xs[2],99],[xs[2],iconY-19]],C.faint,1.1);
 path(ctx,[[cx,99],[cx,iconY-19]],C.faint,1.1);
 xs.forEach((x,i)=>disc(ctx,x,99,2.1,cols[i]));
 documentIcon(ctx,xs[0],iconY,cols[0]);financingIcon(ctx,xs[1],iconY,cols[1]);digitalIcon(ctx,xs[2],iconY,cols[2]);
 const labels=[['Disclosure','quality ↑'],['Financing','constraints ↓'],['Digital','transformation ↑']];
 labels.forEach((lines,i)=>{txt(ctx,lines[0],xs[i],iconY+28,small?12.5:14,C.ink,'center',500);txt(ctx,lines[1],xs[i],iconY+44,small?12:13,cols[i],'center');});
 const joinY=resultTop-9;
 path(ctx,[[xs[0],iconY+52],[xs[0],joinY],[cx,joinY]],'#91a28f',1.1);
 path(ctx,[[xs[2],iconY+52],[xs[2],joinY],[cx,joinY]],'#91a28f',1.1);
 arrow(ctx,cx,iconY+52,cx,resultTop-1,C.mint,1.4);
 rr(ctx,pad,resultTop,w-2*pad,35,7);ctx.fillStyle='#e5e7d5';ctx.fill();ctx.strokeStyle='#acb69a';ctx.lineWidth=1;ctx.stroke();
 txt(ctx,'Cross-region investment ↑',cx,resultTop+23,small?16:18,C.mint,'center',600);
 txt(ctx,'Firm + year fixed effects',cx,h-46,small?11.5:12.5,C.muted,'center');
 ctx.restore();
}
const meta={
 dialysis:{artTop:'RANDOMIZED TRIAL · SURVIVAL',artBottom:'FAN ET AL. · TABLE 2 · ADJUSTED ESTIMATES',artKind:'REPORTED RESULTS',
  alt:'Published adjusted all-cause mortality hazard ratios for peritoneal versus hemodialysis. Intention-to-treat: 0.76, 95% confidence interval 0.47 to 1.24. Per-protocol: 0.83, 0.48 to 1.41. The non-inferiority boundary is 1.25; only the intention-to-treat analysis meets it. Thirty centers, 414 randomized patients.',
  sourceURLs:['https://onlinelibrary.wiley.com/doi/10.1002/med4.56','https://onlinelibrary.wiley.com/doi/10.1002/med4.80'],
  evidence:{table:2,outcome:'all-cause mortality',comparison:'PD relative to HD',adjustment:['age','sex','diabetes status'],ITT:{HR:.76,CI:[.47,1.24],n:411},PP:{HR:.83,CI:[.48,1.41],n:346},nonInferiorityBoundary:1.25,randomized:414,centers:30},
  note:'The 2024 correction addresses funding/conflicts and trial registration, not these effect estimates. The trial stopped recruitment early; PP did not establish non-inferiority.'},
 fintech:{artTop:'FIRM × YEAR EVIDENCE',artBottom:'HUANG ET AL. · 2024',artKind:'METHOD DIAGRAM',
  alt:'Study-reported mechanisms linking regional FinTech development to greater cross-region investment: better disclosure quality, fewer financing constraints, and digital transformation. Chinese A-share firms, 2009 through 2020; firm and year fixed effects. This is a qualitative mechanism diagram, not a plot of estimated coefficients.',
  sourceURLs:['https://www.sciencedirect.com/science/article/pii/S1059056024005161','https://doi.org/10.1016/j.iref.2024.103524'],
  evidence:{sample:'Chinese A-share listed companies',years:[2009,2020],fixedEffects:['firm','year'],channels:['improved information disclosure quality','alleviated financing constraints','digital transformation'],finding:'positive association with domestic and overseas cross-region investment'},
  note:'Only mechanisms and panel structure directly verified in the primary article are pictured. No coefficient magnitude, instrument, or treatment effect is invented.'}
};
root.PROJECT_STUDY_ART={dialysis,fintech,meta};
})(typeof window==='undefined'?globalThis:window);

<script>
/* Final one-page portfolio: Editorial research + Visual Research Gallery projects.
   Research panels compute method demonstrations; project figures summarize their linked sources. */
(() => {
'use strict';
const papers = window.PAPER_DATA || [];
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => Array.from(root.querySelectorAll(s));
const esc = s => String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const statusText = p => p.status === 'review' ? 'UNDER REVIEW' : 'IN PREPARATION';
const projects = [
 {id:'retina',number:'01',year:'2026',category:'MEDICAL AI · VISION–LANGUAGE',title:'BLIP-2 Adaptation for Visual Question Answering',description:'Adapts BLIP-2’s Q-Former, learned queries, and language projection while keeping its image encoder and OPT frozen. Matched comparisons evaluate closed-answer retinal VQA and recognition of independently annotated lesions.',advisors:'Advisors: Dr. Xueqin Wang (USTC) · Dr. Yukang Jiang (UNC School of Medicine)',tags:['BLIP-2','Visual-bridge adaptation','Lesion evidence'],link:'https://github.com/s20011208/Retinal-BLIP2-VQA',linkLabel:'VIEW GITHUB REPOSITORY',linkKind:'external',artTop:'MEDICAL VISION–LANGUAGE',artBottom:'RETINAL VESSEL STUDY',alt:'Abstract retinal vessel illustration; not a patient image.'},
 {id:'dynamics',number:'02',year:'2025–2026',category:'STATISTICAL LEARNING · DYNAMICS',title:'Integrating Mechanism from Heterogeneous Governing Dynamics',description:['We develop a novel statistical learning framework D-SIDE to integrate functional data from heterogeneous higher order dynamics, by selecting sources with similar mechanisms and excluding strongly heterogeneous sources.','The algorithm constructs a statistic to integrate information from heterogeneous data, builds up distribution and induces a source clustering to select data from similar sources, which significantly reduces negative transfer and further applied to model complex dynamic of PM2.5.'],advisors:'Advisors: Dr. Xueqin Wang (USTC) · Dr. Jianbin Tan (Duke)',tags:['Selective integration','Nonparametric ODEs','Source clustering'],link:'https://github.com/s20011208/D-SIDE',linkLabel:'VIEW GITHUB REPOSITORY',linkKind:'external',artTop:'PARTIALLY SHARED DYNAMICS',artBottom:'SCHEMATIC TRAJECTORIES',alt:'Schematic groups of dynamic trajectories with shared and group-specific patterns.'},
 {id:'dialysis',number:'03',year:'2023–2024',category:'CLINICAL STATISTICS · SURVIVAL',title:'Survival and Safety Analysis in a Randomized Dialysis Trial',description:'Compared survival and safety outcomes for peritoneal dialysis and conventional in-center hemodialysis using a multicenter randomized trial. Data cleaning and survival analyses covered 30 centers and 414 patients (411 analyzed), with intention-to-treat and per-protocol analyses.',advisors:'Advisor: Dr. Xueqing Yu (Guangdong Provincial People’s Hospital, SMU)',tags:['Randomized trial','Survival analysis','Non-inferiority'],link:'https://doi.org/10.1002/med4.56',linkLabel:'OPEN ARTICLE DOI',linkKind:'external',artTop:'MULTICENTER RANDOMIZED TRIAL',artBottom:'TRIAL DESIGN · NOT OUTCOME DATA',alt:'Trial-design schematic with randomization and two treatment arms; no outcome curves shown.'},
 {id:'fintech',number:'04',year:'2023–2024',category:'ECONOMETRICS · PANEL DATA',title:'Causal Evaluation of FinTech’s Impact on Cross-Regional Investment',description:['Examine the effects of regional FinTech development on firms’ cross-regional investment using Chinese listed-company panel data (2009–2020).','We combine fixed effects, instrumental variable estimation and difference-in-differences to address endogeneity, with subgroup analyses by ownership, industry, and capital market openness. Results suggest increased domestic and overseas investment with improved disclosure, reduced financing constraints and digital transformation.'],advisors:'Advisor: Dr. Rui Huang (School of National Finance, GDUF)',tags:['Panel data','Fixed effects','IV · DID'],link:'https://doi.org/10.1016/j.iref.2024.103524',linkLabel:'OPEN ARTICLE DOI',linkKind:'external',artTop:'FIRM × YEAR PANEL',artBottom:'SCHEMATIC STRUCTURE · NOT ESTIMATES',alt:'Illustrative firm-year panel trajectories; not observed coefficients or estimates.'}
];
for(const project of projects)Object.assign(project,window.PROJECT_RESEARCH_ART?.meta?.[project.id]||window.PROJECT_STUDY_ART?.meta?.[project.id]||{});
function header(){return `<header class="minimal-header"><div class="minimal-header-inner"><div class="minimal-identity"><a class="minimal-name" href="#top" aria-label="Bingjun Luo home">Bingjun Luo</a><a class="minimal-email" href="mailto:ustclht@mail.ustc.edu.cn">ustclht@mail.ustc.edu.cn</a></div><nav class="minimal-nav" aria-label="Main navigation"><a href="#research">Research</a><a href="#projects">Projects</a></nav></div></header>`;}
function paperStatus(p){return `<span class="status ${p.status}"><span class="status-dot"></span>${statusText(p)}</span>`;}
function paperMeta(p){return `<div class="paper-meta"><span class="method-category"><span class="tiny-orbit"></span>${esc(p.topic)}</span>${paperStatus(p)}</div>`;}
function paperHeader(p){const venue=p.status==='review'?`${p.venue} · UNDER REVIEW`:'MANUSCRIPT IN PREPARATION';return `<div class="paper-id"><span>${p.number}</span><i>/</i><span>04</span></div><h3>${esc(p.title)}</h3><p class="authors">${esc(p.authors)}</p><p class="venue">${esc(venue)}</p>`;}
function paperAbstract(p){return `<div class="paper-abstract"><h4>Abstract</h4><ul>${p.abstract.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`;}
function paperViz(p){if(p.id==='aode')return window.AODE_LAB.cover();if(p.id==='gfsm')return window.GFSM_LAB.html();if(p.id==='rcss')return window.RCSS_LAB.html();return window.SPHERE_LAB.html();}
function paperCard(p,i){return `<article class="feature-paper ${i%2?'flipped':''}" id="paper-${p.id}"><div class="feature-visual">${paperViz(p)}</div><div class="feature-copy">${paperMeta(p)}${paperHeader(p)}<p class="feature-standfirst">${esc(p.problem)}</p><div class="feature-rule"></div>${paperAbstract(p)}</div></article>`;}
function researchSection(){return `<section class="research-section editorial-section" id="research"><div class="wrap"><div class="section-intro"><div><span class="kicker">01 / SELECTED RESEARCH</span><h2>Research.</h2></div><p>Statistical learning, robust estimation, and interpretable dynamical systems. Each manuscript is summarized through its central question and method logic, with an original schematic visualization.</p></div><div class="research-summary-line"><span>FOUR RESEARCH MANUSCRIPTS</span><strong>02 UNDER REVIEW · 02 IN PREPARATION</strong></div>${papers.map(paperCard).join('')}</div></section>`;}
function projectCard(p){const cls=p.linkKind==='private'?'project-action is-private':'project-action';const paragraphs=Array.isArray(p.description)?p.description:[p.description];return `<article class="gallery-work project-work" id="project-${p.id}"><div class="gallery-art project-art"><canvas class="project-canvas" data-project-visual="${p.id}" role="img" aria-label="${esc(p.alt)}"></canvas><div class="project-art-top"><span>${esc(p.artTop)}</span><span>${p.number} / 04</span></div><div class="project-art-bottom"><span>${esc(p.artBottom)}</span><span>${esc(p.artKind||'METHOD DIAGRAM')}</span></div></div><div class="gallery-info"><div class="project-meta"><span>${esc(p.category)}</span><span class="project-year">${esc(p.year)}</span></div><h3>${esc(p.title)}</h3>${paragraphs.map(text=>`<p>${esc(text)}</p>`).join('')}<div class="project-advisors">${esc(p.advisors)}</div><div class="project-tags">${p.tags.map(tag=>`<span>${esc(tag)}</span>`).join('')}</div><a class="${cls}" href="${esc(p.link)}" ${p.linkKind==='external'?'target="_blank" rel="noopener noreferrer"':''}><span>${esc(p.link.replace(/^https?:\/\//,''))}</span><span aria-hidden="true">↗</span></a></div></article>`;}
function projectsSection(){return `<section class="research-section gallery-section projects-section" id="projects"><div class="wrap"><div class="section-intro"><div><span class="kicker">02 / SELECTED WORK</span><h2>Projects.</h2></div><p>Applied work across medical vision–language models, heterogeneous dynamics, clinical-trial analysis, and panel econometrics. Each project has its own visual language and a direct resource or contact link.</p></div><div class="gallery-intro-note"><span>04 PROJECTS</span><span>VISUAL STUDIES · RESPONSIVE GALLERY</span></div><div class="gallery-grid">${projects.map(projectCard).join('')}</div><div class="project-disclaimer">Project figures summarize the linked repositories and articles. The dialysis figure uses reported study estimates; the other diagrams illustrate methods and mechanisms.</div></div></section>`;}
function footer(){return `<footer class="minimal-footer"><div class="minimal-footer-inner"><div class="footer-left"><strong>Bingjun Luo</strong><span>M.S. IN STATISTICS · UNIVERSITY OF SCIENCE AND TECHNOLOGY OF CHINA</span></div><a class="footer-contact" href="mailto:ustclht@mail.ustc.edu.cn">Get in touch ↗</a></div></footer>`;}
function render(){document.title='Bingjun Luo — Research & Projects';document.body.innerHTML=`<a class="skip-link" href="#research">Skip to content</a><div id="top"></div>${header()}<main>${researchSection()}${projectsSection()}</main>${footer()}`;mountProjectVisuals();window.AODE_LAB.mount();window.GFSM_LAB.mount();window.RCSS_LAB.mount();window.SPHERE_LAB.mount();bindNav();}
function bindNav(){const navLinks=$$('.minimal-nav a'),sections=['research','projects'].map(id=>document.getElementById(id)).filter(Boolean);if('IntersectionObserver'in window){const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)navLinks.forEach(a=>{if(a.hash==='#'+entry.target.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}),{rootMargin:'-22% 0px -65% 0px',threshold:0});sections.forEach(s=>io.observe(s));}}
function setupCanvas(canvas){const rect=canvas.getBoundingClientRect();if(rect.width<10||rect.height<10)return null;const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(rect.width*dpr),ph=Math.round(rect.height*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);return{ctx,w:rect.width,h:rect.height};}
function mountProjectVisuals(){
 const art={...window.PROJECT_RESEARCH_ART,...window.PROJECT_STUDY_ART};
 $$('.project-canvas').forEach(canvas=>{
  const draw=()=>{const info=setupCanvas(canvas);if(info)art[canvas.dataset.projectVisual]?.(info.ctx,info.w,info.h);};
  if('ResizeObserver'in window)new ResizeObserver(draw).observe(canvas);else window.addEventListener('resize',draw);
  requestAnimationFrame(draw);
 });
}
render();
})();

</script>
<script>
/* Selected journal layout. Move the mounted figures to preserve their controls. */
(() => {
  'use strict';
  const esc = text => String(text).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

})();

</script>
